<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var time= new Date().getHours();
        if(time<10){
            document.write("Günaydın!Kendinize gelin arkadaşlar");
        }
        else if(time<20){
            document.write("İyi günler!Kendinize gelin arkadaşlar");
        }
        else{
            document.write("Günaydın!Kendinize gelin arkadaşlar");
        }
        switch(time){
            case 10:"Saat 10";break;
            case 11:"Saat 11";break;
            default:"Saat 10 ile 11 arasında";break;
        }
    </script>
</head>
